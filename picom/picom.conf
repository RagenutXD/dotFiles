backend = "glx";
glx-copy-from-front = false;

# Opacity
active-opacity = 1;
inactive-opacity = 0.5;
frame-opacity = 1;
inactive-opacity-override = false;
blur-background = true;
blur-background-exclude = [
	"window_type = 'dock'",
];

blur-method = "dual_kawase";
blur-strength = 5;

opacity-rule = [
    "90:class_g = 'Spotify'",
    "90:class_g = 'Code'",
];


# Fading
fading = true;
fade-delta = 4;
no-fading-openclose = false;


shadow = true;
shadow-radius = 12;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.5;

corner-radius = 8;

